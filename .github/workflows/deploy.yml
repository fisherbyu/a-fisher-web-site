name: Deploy

on:
    # Manual runs from the Actions tab, e.g. to redeploy without a new commit
    workflow_dispatch:
    push:
        branches: [main]

env:
    REGISTRY: ghcr.io
    IMAGE_NAME: ${{ github.repository }}

jobs:
    build:
        runs-on: ubuntu-latest
        permissions:
            contents: read
            packages: write

        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Log in to GHCR
              uses: docker/login-action@v3
              with:
                  registry: ghcr.io
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }} # built-in, no setup needed

            - name: Build and push image
              uses: docker/build-push-action@v5
              with:
                  context: .
                  push: true
                  tags: ghcr.io/${{ github.repository }}:latest
                  build-args: |
                      NEXT_PUBLIC_SUPABASE_URL=${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
                      NEXT_PUBLIC_SUPABASE_ANON_KEY=${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
                      NEXT_PUBLIC_BUCKET_NAME=${{ secrets.NEXT_PUBLIC_BUCKET_NAME }}
                      NEXT_PUBLIC_BASE_SRC=${{ secrets.NEXT_PUBLIC_BASE_SRC }}

    deploy:
        needs: build
        runs-on: ubuntu-latest

        steps:
            - name: Install cloudflared
              run: |
                  curl -fsSL -o cloudflared.deb https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64.deb
                  sudo dpkg -i cloudflared.deb

            - name: Configure SSH
              env:
                  SSH_KEY: ${{ secrets.SERVER_SSH_KEY }}
              run: |
                  mkdir -p ~/.ssh
                  echo "$SSH_KEY" > ~/.ssh/id_deploy
                  chmod 600 ~/.ssh/id_deploy
                  cat >> ~/.ssh/config <<EOF
                  Host deploy
                    HostName ssh.fisherandrew.org
                    User ${{ secrets.SERVER_USER }}
                    IdentityFile ~/.ssh/id_deploy
                    ProxyCommand cloudflared access ssh --hostname %h
                    StrictHostKeyChecking accept-new
                  EOF

            - name: Deploy to server
              env:
                  TUNNEL_SERVICE_TOKEN_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
                  TUNNEL_SERVICE_TOKEN_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
              run: ssh deploy 'bash /srv/a-fisher-data-center/apps/website/deploy.sh'
